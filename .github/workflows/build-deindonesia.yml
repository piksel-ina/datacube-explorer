name: Build Explorer Image

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  REPOSITORY: dc-explorer

jobs:
  prepare-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      full_image_tag: ${{ steps.tag.outputs.full_image_tag }}
    steps:
      - name: Generate date-based tag
        id: tag
        run: |
          IMAGE_TAG="v$(TZ='Asia/Jakarta' date +'%Y%m%d-%H%M')"
          FULL="${{ env.ECR_REGISTRY }}/${{ env.REPOSITORY }}:${IMAGE_TAG}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "full_image_tag=$FULL" >> $GITHUB_OUTPUT

  build-push:
    needs: prepare-tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-explorer
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.REPOSITORY }}
          labels: |
            org.opencontainers.image.title=datacube-explorer
            org.opencontainers.image.version=${{ needs.prepare-tag.outputs.image_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.deindonesia
          push: true
          tags: ${{ needs.prepare-tag.outputs.full_image_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Create Build Summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Docker Build Report
          The following container image was successfully built and pushed to ECR.

          ### ${{ needs.prepare-tag.outputs.full_image_tag }}

          EOF
